<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pife Elegante com Curinga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>Clube do Pife</h1>
            <input type="text" id="username" placeholder="Seu apelido..." autocomplete="off">
            <button onclick="register()">Entrar na Mesa</button>
        </div>
    </div>

    <div id="game-screen" class="screen com-chat" style="display: none;">
        <div class="header">
            <h2 id="player-name"></h2>
            <div id="status-message">Aguardando...</div>
            <div class="header-buttons">
                <button id="btn-start" onclick="startGame()">Iniciar</button>
                <button onclick="resetGame()" class="danger-outline">Resetar</button>
                <button id="btn-toggle-chat" onclick="toggleMobileChat()" style="display: none;">Chat 💬</button>
            </div>
        </div>

        <div id="opponents-area"></div>

        <div class="table-center">
            <div class="deck-area">
                <div id="deck-container">
                    <div class="card back" onclick="drawDeck()">Monte</div>
                </div>
                <button class="action-btn" onclick="drawDeck()">Comprar Monte</button>
            </div>
            
            <div class="deck-area highlight-area">
                <div id="wildcard-container">
                    <div class="card empty">Morta</div>
                </div>
                <div class="status-label">Curinga é: <span id="wildcard-text">-</span></div>
            </div>

            <div class="deck-area">
                <div id="discard-container">
                    <div class="card empty" onclick="drawDiscard()">Lixo</div>
                </div>
                <button class="action-btn" onclick="drawDiscard()">Comprar Lixo</button>
            </div>
        </div>

        <div class="layout-controls">
            <span class="desktop-only">Organizar Mão:</span>
            <button onclick="setLayout('layout-overlap')">Sobreposto</button>
            <button onclick="setLayout('layout-fan')">Leque</button>
            <button onclick="setLayout('layout-flat')">Aberto</button>
            <button class="action-btn danger btn-bater" onclick="bater()">BATER!</button>
        </div>

        <div id="my-hand" class="hand-area layout-overlap"></div>
    </div>

    <div id="chat-panel" style="display: none;">
        <div class="chat-header">
            Resenha da Mesa
            <button id="btn-close-chat" onclick="toggleMobileChat()" style="display: none;">❌</button>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Provoque a galera..." onkeypress="handleChatKey(event)" autocomplete="off">
            <button onclick="sendChatMessage()">Enviar</button>
        </div>
    </div>

    <div id="game-over-screen" class="screen" style="display: none;">
        <div class="login-box" style="max-width: 90vw;">
            <h1 id="winner-msg"></h1>
            <p>Jogos validados pelo Sistema:</p>
            <div id="winner-hand" class="winner-display"></div>
            <button onclick="backToLobby()" style="margin-top: 30px;">Voltar ao Lobby</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
