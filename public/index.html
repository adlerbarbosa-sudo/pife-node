<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clube do Pife</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <meta name="theme-color" content="#1a472a">
</head>
<body class="theme-green">
    <!-- Pop-up Elegante In-Game -->
    <div id="custom-modal" class="custom-modal">
        <div class="custom-modal-content">
            <h3 id="custom-modal-title">Aviso</h3>
            <p id="custom-modal-message"></p>
            <div class="custom-modal-buttons">
                <button id="custom-modal-btn-no" class="danger-outline" style="display:none;">Não</button>
                <button id="custom-modal-btn-yes">OK</button>
            </div>
        </div>
    </div>

    <div id="turn-toast" class="turn-toast"></div>

    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>Clube do Pife</h1>
            <div class="avatar-selection">
                <label><input type="radio" name="avatar" value="🤠" checked> 🤠</label>
                <label><input type="radio" name="avatar" value="👽"> 👽</label>
                <label><input type="radio" name="avatar" value="🤖"> 🤖</label>
                <label><input type="radio" name="avatar" value="🦊"> 🦊</label>
                <label><input type="radio" name="avatar" value="😎"> 😎</label>
                <label><input type="radio" name="avatar" value="🤡"> 🤡</label>
            </div>
            
            <input type="text" id="username" placeholder="Seu apelido..." autocomplete="off">
            
            <hr style="border-color:var(--accent-color); margin: 15px 0; opacity: 0.3;">
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="room" placeholder="Nova Sala (Livre)" autocomplete="off" style="margin-bottom: 0;">
                <input type="password" id="room-password" placeholder="Senha (Opcional)" autocomplete="off" style="margin-bottom: 0;">
            </div>
            
            <button onclick="register()" style="width: 100%; font-size: 1.2rem; padding: 12px;">Criar / Entrar</button>

            <!-- Saguão de Salas Fixo -->
            <div id="lobby-rooms" style="margin-top: 20px; text-align: left; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px;">
                <h4 style="margin-bottom: 10px; color: var(--accent-color); text-transform: uppercase; font-size: 0.9rem;">Salas Abertas Agora:</h4>
                <ul id="room-list" class="room-list">
                    <li style="text-align:center; color:#ccc; font-style:italic;">Conectando ao Saguão...</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen com-chat" style="display: none;">
        <div class="header">
            <h2 id="player-name"></h2>
            
            <div id="status-message">Aguardando...</div>
            
            <div class="header-buttons">
                <div class="emote-wrapper">
                    <button onclick="toggleThemeMenu()" class="action-btn outline">🎨 Mesa</button>
                    <div id="theme-menu" class="emote-menu">
                        <button onclick="changeTheme('theme-green')" style="background: #1a472a; padding: 5px; border:none; border-radius:5px; color:white;">Verde</button>
                        <button onclick="changeTheme('theme-blue')" style="background: #0b2e59; padding: 5px; border:none; border-radius:5px; color:white;">Azul</button>
                        <button onclick="changeTheme('theme-red')" style="background: #7b1113; padding: 5px; border:none; border-radius:5px; color:white;">Vermelho</button>
                        <button onclick="changeTheme('theme-black')" style="background: #111111; padding: 5px; border:none; border-radius:5px; color:white;">Preto</button>
                    </div>
                </div>

                <div class="emote-wrapper">
                    <button onclick="toggleEmoteMenu()" class="action-btn outline">😀 Reagir</button>
                    <div id="emote-menu" class="emote-menu">
                        <span onclick="sendEmote('😂')">😂</span>
                        <span onclick="sendEmote('😡')">😡</span>
                        <span onclick="sendEmote('🍻')">🍻</span>
                        <span onclick="sendEmote('💔')">💔</span>
                        <span onclick="sendEmote('😎')">😎</span>
                        <span onclick="sendEmote('😭')">😭</span>
                    </div>
                </div>

                <button id="btn-start" onclick="startGame()">Iniciar</button>
                <button onclick="resetGame()" class="danger-outline">Resetar</button>
                <button onclick="leaveTable()" class="danger-outline">Sair</button>
                <button id="btn-toggle-chat" onclick="toggleMobileChat()" style="display: none;">Chat 💬</button>
            </div>
        </div>

        <div id="opponents-area"></div>

        <div class="table-center">
            <div class="deck-area">
                <div id="deck-container">
                    <div class="card back" onclick="drawDeck()">
                        Monte
                        <div class="deck-count-badge" id="deck-count">--</div>
                    </div>
                </div>
                <button class="action-btn" onclick="drawDeck()">Comprar Monte</button>
            </div>
            
            <div class="deck-area highlight-area">
                <div class="status-label" style="margin-bottom: 5px;">Curinga da Rodada</div>
                <!-- Display Elegante para o Curinga -->
                <div class="wildcard-wrapper">
                    <div id="wildcard-container" style="opacity: 0.5; transform: scale(0.9);">
                        <div class="card empty">Morta</div>
                    </div>
                    <div id="wildcard-badge" class="wildcard-badge" style="display: none;">⭐ <span id="wildcard-text">-</span></div>
                </div>
            </div>

            <div class="deck-area" ondragover="dragOver(event)" ondrop="dropToDiscard(event)">
                <div id="discard-container">
                    <div class="card empty" onclick="drawDiscard()">Lixo</div>
                </div>
                <button class="action-btn" onclick="drawDiscard()">Comprar Lixo</button>
            </div>
        </div>

        <div class="layout-controls">
            <button class="action-btn highlight-btn" onclick="autoSort()">🪄 Ordenar</button>
            
            <button class="layout-btn" onclick="setLayout('layout-overlap')">Sobreposto</button>
            <button class="layout-btn" onclick="setLayout('layout-fan')">Leque</button>
            <button class="layout-btn" onclick="setLayout('layout-flat')">Aberto</button>
            
            <button class="action-btn danger btn-bater" onclick="bater()">BATER!</button>
        </div>

        <div id="my-hand" class="hand-area layout-overlap"></div>
    </div>

    <div id="chat-panel" style="display: none;">
        <div class="chat-header">
            Sala: <span id="display-room-name">Global</span>
            <button id="btn-close-chat" onclick="toggleMobileChat()" style="display: none;">❌</button>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Provoque a galera..." onkeypress="handleChatKey(event)" autocomplete="off">
            <button onclick="sendChatMessage()">Enviar</button>
        </div>
    </div>

    <div id="game-over-screen" class="screen" style="display: none;">
        <div class="login-box" style="max-width: 90vw; z-index: 500;">
            <h1 id="winner-msg" style="font-size: 2.5rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5);"></h1>
            <p>Jogos validados pelo Sistema:</p>
            <div id="winner-hand" class="winner-display"></div>
            <button onclick="backToLobby()" style="margin-top: 30px; padding: 15px 30px; font-size: 1.2rem;">Nova Rodada</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
