<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Clube do Pife</title>
    <meta name="description" content="Pife online com amigos: salas, chat, contas e placar de vitórias.">
    <meta name="theme-color" content="#1a472a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-green">

<div id="splash" class="screen active"><div class="splash-box"><div class="splash-logo">♠ ♥</div><p>Conectando…</p></div></div>

<!-- ============ ENTRAR ============ -->
<main id="screen-auth" class="screen">
    <section class="panel auth-box">
        <h1 class="logo">♠ Clube do Pife ♥</h1>
        <div class="tabs" role="tablist" aria-label="Como entrar">
            <button type="button" role="tab" class="tab active" data-tab="guest">Convidado</button>
            <button type="button" role="tab" class="tab" data-tab="login">Entrar</button>
            <button type="button" role="tab" class="tab" data-tab="signup">Criar conta</button>
        </div>
        <p id="auth-hint" class="hint"></p>

        <form id="form-guest" class="auth-form" autocomplete="off">
            <div class="avatar-picker" data-picker role="radiogroup" aria-label="Escolha seu avatar"></div>
            <label class="field"><span>Seu apelido</span>
                <input id="guest-nick" maxlength="16" placeholder="Ex.: Zeca" autocomplete="off" required></label>
            <button class="btn primary big" type="submit">Jogar como convidado</button>
        </form>

        <form id="form-login" class="auth-form" hidden>
            <label class="field"><span>Usuário</span>
                <input id="login-user" maxlength="16" autocomplete="username" autocapitalize="none" required></label>
            <label class="field"><span>Senha</span>
                <input id="login-pass" type="password" maxlength="64" autocomplete="current-password" required></label>
            <button class="btn primary big" type="submit">Entrar</button>
        </form>

        <form id="form-signup" class="auth-form" hidden>
            <div class="avatar-picker" data-picker role="radiogroup" aria-label="Escolha seu avatar"></div>
            <label class="field"><span>Nome de usuário (3 a 16: letras, números, _ ou -)</span>
                <input id="signup-user" maxlength="16" autocomplete="username" autocapitalize="none" required></label>
            <label class="field"><span>Senha (mínimo 6)</span>
                <input id="signup-pass" type="password" minlength="6" maxlength="64" autocomplete="new-password" required></label>
            <button class="btn primary big" type="submit">Criar conta</button>
        </form>

        <p id="auth-error" class="error" role="alert"></p>
        <button type="button" id="btn-auth-back" class="btn ghost" hidden>← Voltar ao saguão</button>
        <button type="button" class="btn ghost small" data-help>❓ Como jogar</button>
    </section>
</main>

<!-- ============ SAGUÃO ============ -->
<main id="screen-lobby" class="screen">
    <section class="panel lobby-box">
        <div class="profile-bar">
            <span id="lobby-avatar" class="big-avatar"></span>
            <div class="profile-text">
                <b id="lobby-name"></b>
                <small id="lobby-kind"></small>
            </div>
            <span id="lobby-wins" class="trophy" title="Vitórias"></span>
            <button type="button" id="btn-logout" class="btn ghost small">Sair</button>
        </div>
        <p id="lobby-note" class="hint"></p>
        <button type="button" id="btn-upgrade" class="btn small" hidden>⭐ Criar conta e guardar minhas vitórias</button>

        <form id="form-join" class="join-form">
            <label class="field"><span>Nome da sala</span>
                <input id="join-room" maxlength="20" placeholder="MESA1" autocomplete="off"></label>
            <label class="field"><span>Senha (opcional)</span>
                <input id="join-pass" type="password" maxlength="64" placeholder="sem senha" autocomplete="off"></label>
            <button class="btn primary big" type="submit">Criar / Entrar</button>
        </form>

        <h2 class="section-title">Salas abertas agora</h2>
        <ul id="room-list" class="room-list"></ul>
        <button type="button" class="btn ghost small" data-help>❓ Como jogar</button>
    </section>
</main>

<!-- ============ MESA ============ -->
<main id="screen-game" class="screen">
    <header class="topbar">
        <div id="me-chip" class="me-chip"></div>
        <div class="room-chip">Sala <b id="room-name"></b></div>
        <div class="top-actions">
            <button type="button" id="btn-help" class="icon-btn" aria-label="Como jogar">❓</button>
            <button type="button" id="btn-chat" class="icon-btn" aria-label="Abrir chat">💬<span id="chat-dot" class="dot" hidden></span></button>
            <button type="button" id="btn-menu" class="icon-btn" aria-label="Menu">☰</button>
        </div>
    </header>

    <div id="hint" class="hintbar" role="status" aria-live="polite"></div>

    <section id="opponents" class="opps" aria-label="Adversários"></section>

    <section class="table" aria-label="Mesa">
        <div id="pile-deck" class="pile" role="button" tabindex="0" aria-label="Comprar do Monte">
            <div class="pile-card"></div>
            <span class="pile-label">Monte</span>
        </div>
        <div id="pile-wild" class="pile static">
            <div class="pile-card"></div>
            <span class="pile-label" id="wild-label">Curinga</span>
        </div>
        <div id="pile-discard" class="pile" role="button" tabindex="0" aria-label="Comprar do Lixo">
            <div class="pile-card"></div>
            <span class="pile-label">Lixo</span>
        </div>
    </section>

    <section id="meld-status" class="meld-status" aria-live="polite"></section>
    <section id="hand" class="hand mode-open" aria-label="Sua mão"></section>

    <nav class="actionbar" aria-label="Ações">
        <button type="button" id="btn-sort" class="btn">🪄 Ordenar</button>
        <button type="button" id="btn-discard" class="btn">Descartar</button>
        <button type="button" id="btn-bater" class="btn danger">BATER!</button>
    </nav>

    <aside id="chat" class="chat" aria-label="Chat da sala">
        <div class="chat-head"><span>💬 Sala <b id="chat-room"></b></span>
            <button type="button" id="btn-chat-close" class="icon-btn" aria-label="Fechar chat">✕</button></div>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
            <input id="chat-input" maxlength="200" placeholder="Escreva uma mensagem…" enterkeyhint="send">
            <button class="btn" type="submit">Enviar</button>
        </form>
    </aside>
</main>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script src="rules.js"></script>
<script src="client.js"></script>
</body>
</html>
